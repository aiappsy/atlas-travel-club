<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="atlasGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D8" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#B3861B" />
      <stop offset="100%" stop-color="#FCEAB1" />
    </linearGradient>
    <linearGradient id="atlasOrbit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B3861B" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#E5C158" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFF5D8" />
      <stop offset="70%" stop-color="#E5C158" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#B3861B" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Mark Group -->
  <g transform="translate(300, 240)">
    <!-- Orbit -->
    <ellipse cx="0" cy="-5" rx="195" ry="58" fill="none" stroke="url(#atlasOrbit)" stroke-width="3.5" transform="rotate(-15)" />
    <ellipse cx="0" cy="-5" rx="180" ry="32" fill="none" stroke="url(#atlasGold)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" transform="rotate(-15)" />
    
    <!-- Left Stem -->
    <polygon points="-6,-170 -20,-170 -115,135 -85,135 -14,-125" fill="url(#atlasGold)" />
    <rect x="-135" y="130" width="60" height="7" rx="1" fill="url(#atlasGold)" />

    <!-- Right Stem -->
    <polygon points="2,-170 20,-170 125,135 80,135 8,-125" fill="url(#atlasGold)" />
    <rect x="65" y="130" width="70" height="7" rx="1" fill="url(#atlasGold)" />

    <!-- Apex Star -->
    <g transform="translate(0, -192)">
      <polygon points="0,-18 3.5,-5.5 16,-5.5 6,2.5 9.5,15 0,7 -9.5,15 -6,2.5 -16,-5.5 -3.5,-5.5" fill="url(#atlasGold)" />
    </g>

    <!-- Crossbar -->
    <path d="M -100,25 Q 0,-18 100,25 Q 50,6 0,2 Q -50,6 -100,25 Z" fill="url(#atlasGold)" />
  </g>

  <!-- Wordmark -->
  <text x="300" y="520" 
        font-family="'Cinzel', 'Trajan Pro', 'Didot', 'Times New Roman', serif" 
        font-size="76" 
        font-weight="600" 
        letter-spacing="24" 
        fill="url(#atlasGold)" 
        text-anchor="middle">ATLAS</text>

  <text x="300" y="585" 
        font-family="'Montserrat', 'Helvetica Neue', sans-serif" 
        font-size="20" 
        font-weight="400" 
        letter-spacing="18" 
        fill="#E5C158" 
        opacity="0.9"
        text-anchor="middle">TRAVEL CLUB</text>

  <line x1="220" y1="625" x2="380" y2="625" stroke="url(#atlasGold)" stroke-width="1.2" opacity="0.5" />
  <circle cx="300" cy="625" r="2.5" fill="url(#atlasGold)" />
</svg>

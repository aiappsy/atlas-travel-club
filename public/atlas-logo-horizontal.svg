    <ellipse cx="0" cy="-5" rx="195" ry="58" fill="none" stroke="url(#hAtlasOrbit)" stroke-width="4" transform="rotate(-15)" />
    <polygon points="-6,-170 -20,-170 -115,135 -85,135 -14,-125" fill="url(#hAtlasGold)" />
    <rect x="-135" y="130" width="60" height="7" rx="1" fill="url(#hAtlasGold)" />

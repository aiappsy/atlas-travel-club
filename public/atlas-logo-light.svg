<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 160" width="100%" height="100%">
  <defs>
    <linearGradient id="hAtlasGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>
    <linearGradient id="hAtlasOrbitLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA7C11" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(85, 80) scale(0.40)">
    <ellipse cx="0" cy="-5" rx="195" ry="58" fill="none" stroke="url(#hAtlasOrbitLight)" stroke-width="4.5" transform="rotate(-15)" />
    <polygon points="-6,-170 -20,-170 -115,135 -85,135 -14,-125" fill="url(#hAtlasGoldLight)" />
    <rect x="-135" y="130" width="60" height="7" rx="1" fill="url(#hAtlasGoldLight)" />
    <polygon points="2,-170 20,-170 125,135 80,135 8,-125" fill="url(#hAtlasGoldLight)" />
    <rect x="65" y="130" width="70" height="7" rx="1" fill="url(#hAtlasGoldLight)" />
    <g transform="translate(0, -192)">
      <polygon points="0,-18 3.5,-5.5 16,-5.5 6,2.5 9.5,15 0,7 -9.5,15 -6,2.5 -16,-5.5 -3.5,-5.5" fill="url(#hAtlasGoldLight)" />
    </g>
    <path d="M -100,25 Q 0,-18 100,25 Q 50,6 0,2 Q -50,6 -100,25 Z" fill="url(#hAtlasGoldLight)" />
  </g>

  <!-- Subtle Vertical Divider -->
  <line x1="185" y1="30" x2="185" y2="130" stroke="#CBD5E1" stroke-width="2" />

  <!-- Right Typography: Bold, high contrast, readable -->
  <text x="215" y="86" 
        font-family="'Cinzel', 'Trajan Pro', 'Didot', serif" 
        font-size="56" 
        font-weight="800" 
        letter-spacing="16" 

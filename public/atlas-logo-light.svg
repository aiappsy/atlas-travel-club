  <text x="218" y="122" 
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="20" 
        font-weight="800" 
        letter-spacing="9" 
        fill="#475569">TRAVEL CLUB</text>
</svg>

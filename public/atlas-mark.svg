<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="atlasGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D8" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#B3861B" />
      <stop offset="100%" stop-color="#FCEAB1" />
    </linearGradient>
    <linearGradient id="atlasOrbit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B3861B" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#E5C158" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFF5D8" />
      <stop offset="70%" stop-color="#E5C158" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#B3861B" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Outer Orbit Meridian Ring -->
  <ellipse cx="250" cy="245" rx="195" ry="58" fill="none" stroke="url(#atlasOrbit)" stroke-width="4" transform="rotate(-15 250 245)" />
  <ellipse cx="250" cy="245" rx="180" ry="32" fill="none" stroke="url(#atlasGold)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" transform="rotate(-15 250 245)" />

  <!-- Left Stem -->
  <polygon points="244,80 230,80 135,385 165,385 236,125" fill="url(#atlasGold)" />
  <rect x="115" y="380" width="60" height="7" rx="1" fill="url(#atlasGold)" />

  <!-- Right Stem -->
  <polygon points="252,80 270,80 375,385 330,385 258,125" fill="url(#atlasGold)" />
  <rect x="315" y="380" width="70" height="7" rx="1" fill="url(#atlasGold)" />

  <!-- Apex Star -->
  <g transform="translate(250, 58)">
    <polygon points="0,-18 3.5,-5.5 16,-5.5 6,2.5 9.5,15 0,7 -9.5,15 -6,2.5 -16,-5.5 -3.5,-5.5" fill="url(#atlasGold)" />
  </g>

  <!-- Sweeping Horizon Crossbar -->
  <path d="M 150,275 Q 250,232 350,275 Q 300,256 250,252 Q 198,256 150,275 Z" fill="url(#atlasGold)" />
</svg>
